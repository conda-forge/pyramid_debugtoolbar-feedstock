{% set name = "pyramid_debugtoolbar" %}
{% set version = "4.13" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: cf359fb4b42ba804d71330d9dd8389a4e68863d4ff1bf9c13f155c5d597bab1a

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}
    - pyramid >=1.4
    - pyramid_mako >=0.3.1
    - repoze.lru
    - pygments

test:
  requires:
    - python {{ python_min }}
  imports:
    - pyramid_debugtoolbar

about:
  home: https://trypyramid.com
  license: LicenseRef-Pylons
  license_family: BSD
  license_file: LICENSE.txt
  summary: The Pyramid Web Framework, a Pylons project
  doc_url: https://docs.pylonsproject.org/projects/pyramid_mako/en/latest/
  dev_url: https://github.com/Pylons/pyramid_mako

extra:
  recipe-maintainers:
    - ChrisBarker-NOAA
    - JamesMakela-NOAA
